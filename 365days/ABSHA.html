<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1 Year</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow-x: hidden;
    font-family: 'Arial', sans-serif;
    color: white;
    text-align: center;
    min-height: 100vh;
}

/* New Working Fireworks background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Updated working fireworks link */
    background: url("https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif");
    background-size: cover;
    background-position: center;
    opacity: 0.25;
    z-index: -2;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: #ff2e63;
    pointer-events: none;
    animation: float 6s linear infinite;
    z-index: -1;
}

@keyframes float {
    0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    90% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
    }
}

/* Title */
h1 {
    margin-top: 40px;
    font-size: clamp(35px, 8vw, 60px);
    color: #ff2e63;
    text-shadow: 0 0 20px rgba(255, 46, 99, 0.8);
    padding: 0 10px;
}

/* Sub line */
.line {
    width: 200px;
    height: 2px;
    background: #ff2e63;
    margin: 20px auto;
    position: relative;
}
.line::after {
    content: "❤";
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff2e63;
    background: #000;
    padding: 0 10px;
}

/* Message */
p {
    max-width: 600px;
    margin: 30px auto;
    line-height: 2;
    font-size: 18px;
    color: #fff;
    padding: 0 20px;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
}

/* Button */
button {
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    background: #ff2e63;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 46, 99, 0.5);
    transition: all 0.3s ease;
    margin-bottom: 20px;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255, 46, 99, 0.8);
}

/* Hidden surprise */
#surprise {
    display: none;
    font-size: 24px;
    font-weight: bold;
    margin: 20px auto;
    color: #ffb3c1;
    text-shadow: 0 0 10px rgba(255, 179, 193, 0.6);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Image frame */
.photo {
    margin: 40px auto;
    width: 320px;
    height: 220px;
    border: 3px solid #ff2e63;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255, 46, 99, 0.6);
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<h1>❤ Happy 1 Year ❤</h1>

<div class="line"></div>

<p>
Alhamdulillah for this beautiful year together.<br>
You have been my support, my happiness and my constant.<br>
Thank you for all the love, care and understanding.<br>
May Allah always keep us together and protect us from evil eye. Ameen 🤲
</p>

<button onclick="showSurprise()">Click for Surprise 🎁</button>

<div id="surprise">
💖 You are my Future MEHRAM 💖
</div>

<div class="photo">
    <!-- Aap apni marzi ki pic ka link yahan daal sakti hain -->
    <img src="images.jpg" alt="Together" />
</div>

<script>
/* hearts generator */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 20) + "px";
    
    // Random float speed variations
    let duration = 4 + Math.random() * 4;
    heart.style.animationDuration = duration + "s";
    
    document.body.appendChild(heart);

    setTimeout(() => { heart.remove(); }, duration * 1000);
}, 400);

/* surprise button */
function showSurprise() {
    let surpriseDiv = document.getElementById("surprise");
    surpriseDiv.style.display = "block";
}
</script>

</body>
</html>
